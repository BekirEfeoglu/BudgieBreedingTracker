name: Release Ready

on:
  workflow_dispatch:
    inputs:
      build_android_aab:
        description: Build Android release AAB artifact
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Release Ready Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Show selected release checks
        run: |
          echo "Android AAB: ${{ inputs.build_android_aab }}"

  android-release:
    name: Android Release (AAB)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [plan]
    if: inputs.build_android_aab
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.41.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/budgie-release-key.jks

      - name: Create key.properties from secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties << EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=budgie-release-key.jks
          EOF

      - name: Verify production observability
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [ -z "$SENTRY_DSN" ]; then
            echo "ERROR: SENTRY_DSN GitHub Actions secret is missing."
            exit 1
          fi
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "ERROR: SENTRY_AUTH_TOKEN GitHub Actions secret is missing."
            exit 1
          fi
          echo "Sentry production monitoring and symbol upload are configured."

      - name: Build Android App Bundle (release)
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/symbols/android \
            --extra-gen-snapshot-options=--save-obfuscation-map=build/app/obfuscation.map.json \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=SENTRY_ENVIRONMENT=production \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }} \
            --dart-define=GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}

      - name: Upload Android debug symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          APP_VERSION="$(sed -n 's/^version: //p' pubspec.yaml | head -1)"
          SENTRY_DIST="${APP_VERSION##*+}"
          export SENTRY_RELEASE="com.budgiebreeding.budgie_breeding_tracker@${APP_VERSION}"
          export SENTRY_DIST
          dart run sentry_dart_plugin

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-release-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # The Dart obfuscation map ships alongside the native debug symbols.
      # It is NOT what `flutter symbolize` consumes — that takes only the
      # --split-debug-info symbols file (`flutter symbolize --help`). The map
      # is the separate identifier name-mapping that Sentry reads via
      # pubspec's `sentry: dart_symbol_map_path`, and it is the only build
      # output carrying it. Keeping it here means an offline copy survives if
      # the Sentry upload is ever lost. Two paths make `build/` the artifact
      # root, so entries land at `symbols/android/...` and
      # `app/obfuscation.map.json`.
      - name: Upload Android debug symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-symbols-${{ github.sha }}
          path: |
            build/symbols/android/**
            build/app/obfuscation.map.json
          retention-days: 90
          if-no-files-found: warn
