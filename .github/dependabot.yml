version: 2
updates:
  # Flutter/Dart dependencies (pubspec.yaml)
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "dart"
    commit-message:
      prefix: "chore(deps)"
    reviewers:
      - "BekirEfeoglu"
    # Deliberately held bumps — see dev-docs/dependency-upgrade-notes.md.
    # Remove the matching entry when its precondition clears.
    ignore:
      # iOS CI cap: 2.13+ pulls passkeys -> device_info_plus visionOS selector
      # which breaks the iOS build (architecture.md; pubspec pins <2.13.0).
      - dependency-name: "supabase_flutter"
        versions: [">=2.13.0"]
      # drift 2.34 -> analyzer ^13 conflicts with riverpod_generator (analyzer ^12)
      # and the Flutter SDK's flutter_test meta 1.17 pin. Needs a coordinated
      # riverpod_generator + Flutter SDK upgrade first.
      - dependency-name: "drift"
        versions: [">=2.34.0"]
      - dependency-name: "drift_dev"
        versions: [">=2.34.0"]
      # Hold the 10.x line (incl. pre-releases) until a stable 10.x ships; the
      # 9 -> 10 migration is its own task.
      - dependency-name: "sentry_flutter"
        versions: [">=10.0.0-0"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
    reviewers:
      - "BekirEfeoglu"

  # npm dependencies (promo-video)
  - package-ecosystem: "npm"
    directory: "/promo-video"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    reviewers:
      - "BekirEfeoglu"
